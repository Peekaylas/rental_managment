services:
  - type: web
    name: rental-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: "Affordable Housing & Rental Management System"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        value: sqlite:///./rental_management.db
      - key: FIRST_ADMIN_EMAIL
        value: admin@rental.com
      - key: FIRST_ADMIN_PASSWORD
        value: Admin@1234
